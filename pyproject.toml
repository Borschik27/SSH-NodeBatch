[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-nodebatch"
version = "0.3.0"
description = "Run commands and transfer files across SSH hosts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.8,<7", "PyYAML>=6.0.2,<7"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7", "paramiko>=5,<6"]
[project.gui-scripts]
nodebatch = "nodebatch.app:main"
[project.scripts]
nodebatch-askpass = "nodebatch.askpass:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools]
include-package-data = false
[tool.setuptools.package-data]
nodebatch = ["defaults/settings.yaml", "defaults/inventory.yaml", "defaults/safety.yaml", "defaults/dependencies.yaml", "defaults/scenarios/system-info.yaml", "remote_agent.txt", "locales/ru.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
